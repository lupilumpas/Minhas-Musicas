<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Meu Player</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <main class="app">
    <header>
      <h1>🎵 Meu Player</h1>
      <p>Player de músicas offline</p>
    </header>

    <section class="player">
      <h2 id="music-title">Nenhuma música selecionada</h2>

      <input id="progress" type="range" min="0" max="100" value="0">

      <div class="times">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button id="prev" title="Anterior">⏮</button>
        <button id="play" class="play" title="Play/Pause">▶</button>
        <button id="next" title="Próxima">⏭</button>
      </div>

      <div class="secondary">
        <button id="shuffle">🔀 Aleatório: ON</button>
        <button id="repeat">🔁 Repetir: OFF</button>
      </div>
    </section>

    <section class="playlist">
      <h2>Lista de músicas</h2>
      <div id="song-list"></div>
    </section>
  </main>

  <audio id="audio" preload="metadata"></audio>
  <script src="script.js?v=1"></script>
</body>
</html>
